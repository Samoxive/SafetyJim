[package]
name = "safetyjim"
version = "5.0.0"
edition = "2021"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
argh = "0.1.19"
async-recursion = "1.2.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-routing"] }
chrono = "0.4.45"
envy = "0.4.2"
humantime = "2.4.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lazy_static = "1.5.1"
mimalloc = { version = "0.1.52", default-features = false }
moka = { version = "0.12.16", features = ["future"] }
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "gzip", "json", "query", "form"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serenity = { version = "0.12.5", default-features = false, features = ["rustls_backend", "builder", "client", "gateway", "http", "model", "unstable_discord_api", "collector"] }
simsearch = "0.4.0"
smol_str = "0.3.7"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-futures = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "registry", "env-filter"] }
typemap_rev = "0.4.0"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
